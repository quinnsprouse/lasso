# Toolchain-owned git hooks. `npm run setup` (lefthook install) restores them
# after a fresh clone or a late `git init`.
pre-commit:
  parallel: true
  jobs:
    - name: format staged
      glob: "*.{ts,mjs,json,md}"
      run: npx biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: lint staged
      glob: "*.{ts,mjs}"
      run: npx oxlint {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}

pre-push:
  jobs:
    - name: push profile
      run: npm run check:push
