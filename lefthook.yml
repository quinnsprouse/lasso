# Toolchain-owned git hooks. `npm run setup` (lefthook install) restores them
# after a fresh clone or a late `git init`. Tools run as `node <package entry>`
# from node_modules — never npx, which would fetch a same-named package from
# the registry when the install is missing.
pre-commit:
  # Sequential: lint must see the formatted file, not the pre-format staged content.
  parallel: false
  jobs:
    - name: format staged
      glob: "*.{ts,mjs,cjs,json}"
      run: node node_modules/@biomejs/biome/bin/biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: lint staged
      glob: "*.{ts,mjs,cjs}"
      run: node node_modules/oxlint/bin/oxlint --type-aware --deny-warnings {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: node node_modules/@commitlint/cli/cli.js --edit {1}

pre-push:
  jobs:
    - name: push profile
      run: npm run check:push
