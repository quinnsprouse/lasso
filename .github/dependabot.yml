# The lockstep policy, made mechanical. Two groups may never move alone:
# the Effect packages (exact-pinned release candidate, test helper included),
# and the type-aware toolchain quartet. `effect-tsgo patch` ships binaries for
# specific oxlint and oxlint-tsgolint versions: a toolchain PR whose `npm ci`
# fails in `prepare` names a version @effect/tsgo does not support yet, so
# wait for the @effect/tsgo release that adds it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The shipped CLI supports Node 22.19 and newer (package.json engines).
      # Types from a newer major would let code call APIs Node 22 lacks, so
      # @types/node takes minor and patch updates only; raise its major together
      # with engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      effect-runtime:
        patterns:
          - effect
          - "@effect/platform-node"
          - "@effect/vitest"
      toolchain-lockstep:
        patterns:
          - "@effect/tsgo"
          - typescript
          - oxlint
          - oxlint-tsgolint
      dev-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - effect
          - "@effect/platform-node"
          - "@effect/vitest"
          - "@effect/tsgo"
          - typescript
          - oxlint
          - oxlint-tsgolint
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
