# The lockstep policy, made mechanical. Two groups may never move alone:
# the Effect runtime pair (exact-pinned beta), and the type-aware toolchain
# quartet whose patch mechanism requires matching versions.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      effect-runtime:
        patterns:
          - effect
          - "@effect/platform-node"
      toolchain-lockstep:
        patterns:
          - "@effect/tsgo"
          - typescript
          - oxlint
          - oxlint-tsgolint
      dev-tooling:
        patterns:
          - "*"
        exclude-patterns:
          - effect
          - "@effect/platform-node"
          - "@effect/tsgo"
          - typescript
          - oxlint
          - oxlint-tsgolint
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
